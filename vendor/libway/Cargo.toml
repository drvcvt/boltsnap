[package]
name = "libway"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Bounded Wayland capture with SHM and optional DMA-BUF frames"
license = "MIT"

[features]
default = ["capture", "image"]
capture = []
image = ["capture", "dep:image"]
gpu = ["capture", "dep:gbm"]
# Desktop tiles read back from dma-bufs: linear mmap, or Vulkan loaded at runtime.
vulkan = ["gpu", "dep:ash"]
dnd = []
foreign-display = ["dnd", "wayland-client/system"]
# Caller-owned windows (`window::Host`) and the runtime they run on.
window = []
owned-native-system = ["window", "wayland-client/system", "wayland-client/dlopen", "dep:raw-window-handle"]

[dependencies]
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.12", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
memmap2 = "0.9"
libc = "0.2"
image = { version = "0.25.10", default-features = false, optional = true }
gbm = { version = "0.18", default-features = false, optional = true }
ash = { version = "0.38", default-features = false, features = ["loaded", "std"], optional = true }
raw-window-handle = { version = "=0.6.2", optional = true, features = ["std"] }

[dev-dependencies]
wayland-server = "0.31.14"
wayland-protocols = { version = "0.32.12", features = ["server"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["server"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }

[[example]]
name = "snapshot"
required-features = ["image"]

[[example]]
name = "desktop_timing"
required-features = ["image"]

[[example]]
name = "frames"
required-features = ["capture"]

[[example]]
name = "attention"
required-features = ["window"]

[[example]]
name = "colors"
required-features = ["window"]

[[example]]
name = "layer"
required-features = ["window"]

[[example]]
name = "presentation"
required-features = ["window"]

[[example]]
name = "primary"
required-features = ["window"]

[[example]]
name = "window"
required-features = ["window"]

[[example]]
name = "popup"
required-features = ["window"]
