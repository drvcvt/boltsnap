[package]
name = "boltsnap-replay-worker"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[target.'cfg(target_os = "linux")'.dependencies]
ffmpeg-next = { version = "=9.0.0", default-features = false, features = ["format"] }
libc = "0.2"
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
