[package]
name = "boltsnap-replay-worker"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[target.'cfg(target_os = "linux")'.dependencies]
ffmpeg-next = { version = "=9.0.0", default-features = false, features = ["format"] }
libc = "0.2"
serde_json = "1.0"

[features]
native-cursor = ["dep:libway", "dep:cc", "dep:pkg-config"]

[target.'cfg(target_os = "linux")'.dependencies.libway]
path = "../../../../../vendor/libway"
version = "0.1.0"
default-features = false
features = ["gpu"]
optional = true

[build-dependencies]
cc = { version = "1", optional = true }
pkg-config = { version = "0.3", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
