name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux (fmt + test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config build-essential \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgbm-dev \
            libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check

      - run: cargo test --locked

      - run: python3 tools/sync-libway.py --check
      - run: cargo fmt --manifest-path vendor/libway/Cargo.toml --check
      - run: cargo test --manifest-path vendor/libway/Cargo.toml --locked --no-default-features
      - run: cargo test --manifest-path vendor/libway/Cargo.toml --locked --all-features
      - run: cargo build --locked --bin boltsnap
      - name: Boltsnap capture against an isolated Wayland server
        run: LIBWAY_TEST_BOLTSNAP="$PWD/target/debug/boltsnap" cargo test --manifest-path vendor/libway/Cargo.toml --locked --test consumer -- --ignored

  replay-worker:
    name: Replay worker (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev libavformat-dev libavcodec-dev libavutil-dev ffmpeg

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Generated FFmpeg bindings depend on the distro's native ABI.
          prefix-key: replay-${{ matrix.os }}-v1
          workspaces: src/platform/linux/replay/worker -> target

      - run: cargo fmt --manifest-path src/platform/linux/replay/worker/Cargo.toml --check
      - run: cargo test --manifest-path src/platform/linux/replay/worker/Cargo.toml --locked
      - run: cargo build --manifest-path src/platform/linux/replay/worker/Cargo.toml --locked
      - run: python3 src/platform/linux/replay/worker/tests/probe.py --worker src/platform/linux/replay/worker/target/debug/boltsnap-replay-worker
      - run: python3 src/platform/linux/replay/worker/tests/live.py --worker src/platform/linux/replay/worker/target/debug/boltsnap-replay-worker

  gsr-cursor-plugin:
    name: Smooth cursor gsr plugin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GL runtime for the offscreen draw check
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libegl-mesa0 libgl1-mesa-dri

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/platform/linux/gsr_cursor -> target

      - run: cargo fmt --manifest-path src/platform/linux/gsr_cursor/Cargo.toml --check
      - run: cargo clippy --manifest-path src/platform/linux/gsr_cursor/Cargo.toml --locked --all-targets -- -D warnings
      # Includes the surfaceless EGL (llvmpipe) draw check.
      - run: cargo test --manifest-path src/platform/linux/gsr_cursor/Cargo.toml --locked -- --include-ignored
      - run: cargo build --manifest-path src/platform/linux/gsr_cursor/Cargo.toml --locked --release

  windows:
    name: Windows (test)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --locked
