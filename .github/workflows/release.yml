name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.4.0)'
        required: true

permissions:
  contents: write

jobs:
  windows-x86_64:
    name: Windows x86_64 (binary + ZIP + MSI + NSIS)
    runs-on: windows-latest
    env:
      TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out Eddy
        uses: actions/checkout@v4
        with:
          repository: change4u/eddy
          ref: 5bd03391f88648dbb968f3968304802fc818b40c
          path: eddy

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Resolve release version
        shell: pwsh
        run: |
          $version = $env:TAG_NAME.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH: $env:TAG_NAME"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cargo test
        run: cargo test --release --locked

      - name: Cargo build (release)
        run: cargo build --release --locked

      - name: Build MSI
        shell: pwsh
        run: |
          ./packaging/windows/build-msi.ps1 `
            -EddyRepository "$env:GITHUB_WORKSPACE/eddy" `
            -QtDirectory $env:QT_ROOT_DIR `
            -Version $env:RELEASE_VERSION `
            -SkipBuild

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Build NSIS installer
        shell: pwsh
        run: |
          ./packaging/windows/build-nsis.ps1 `
            -EddyRepository "$env:GITHUB_WORKSPACE/eddy" `
            -QtDirectory $env:QT_ROOT_DIR `
            -Version $env:RELEASE_VERSION `
            -SkipBuild `
            -SkipEddyBuild

      - name: Stage portable ZIP
        shell: pwsh
        run: |
          $name = "boltsnap-$env:TAG_NAME-x86_64-windows"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item target/release/boltsnap.exe "dist/$name/boltsnap.exe"
          Copy-Item target/release/boltsnap-background.exe "dist/$name/boltsnap-background.exe"
          Copy-Item README.md "dist/$name/README.md"
          Copy-Item LICENSE "dist/$name/LICENSE"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      - name: Generate Windows checksums
        shell: pwsh
        run: |
          @(
            Get-ChildItem dist -Filter '*.zip' -File
            Get-ChildItem dist/msi -Filter '*.msi' -File
            Get-ChildItem dist/nsis -Filter '*.exe' -File
          ) |
            Sort-Object Name |
            ForEach-Object {
              "$(($_ | Get-FileHash -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
            } | Set-Content -Encoding ascii dist/SHA256SUMS-windows

      - name: Create / update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: boltsnap ${{ env.TAG_NAME }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/msi/*.msi
            dist/nsis/*.exe
            dist/SHA256SUMS-windows

  linux-x86_64:
    name: Linux x86_64 (binary + .deb)
    runs-on: ubuntu-22.04
    env:
      TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config build-essential \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cargo build (release)
        run: cargo build --release --locked

      - name: Cargo test
        run: cargo test --release --locked

      - name: Strip binary
        run: strip target/release/boltsnap

      - name: Stage binary tarball
        id: stage
        run: |
          set -euo pipefail
          TAG="${TAG_NAME}"
          NAME="boltsnap-${TAG}-x86_64-linux"
          mkdir -p "dist/${NAME}"
          install -Dm755 target/release/boltsnap "dist/${NAME}/boltsnap"
          install -Dm644 README.md             "dist/${NAME}/README.md"
          install -Dm644 LICENSE               "dist/${NAME}/LICENSE"
          tar -C dist -czvf "dist/${NAME}.tar.gz" "${NAME}"
          rm -rf "dist/${NAME}"
          echo "tarball=dist/${NAME}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Install cargo-deb
        run: cargo install --locked cargo-deb

      - name: Build .deb
        run: |
          set -euo pipefail
          cargo deb --no-build --output dist/
          ls -la dist/

      - name: Generate SHA256 sums
        run: |
          cd dist
          sha256sum *.tar.gz *.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Create / update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: boltsnap ${{ env.TAG_NAME }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
