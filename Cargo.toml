[package]
name = "boltsnap"
version = "0.3.0"
edition = "2024"
description = "In-process Wayland and X11 screenshot tool with built-in annotation editor."
license = "MIT"
readme = "README.md"
keywords = ["screenshot", "wayland", "hyprland", "x11", "egui"]
categories = ["command-line-utilities", "multimedia::images"]

[dependencies]
eframe = "0.34.1"
egui-phosphor = "0.12"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg"] }
serde_json = "1.0"
libwayshot = "0.7"
wl-clipboard-rs = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
