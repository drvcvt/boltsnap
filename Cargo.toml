[package]
name = "boltsnap"
version = "0.4.2"
edition = "2024"
description = "In-process Wayland and X11 screenshot tool with built-in annotation editor."
license = "MIT"
readme = "README.md"
keywords = ["screenshot", "wayland", "hyprland", "x11", "tiny-skia"]
categories = ["command-line-utilities", "multimedia::images"]

[dependencies]
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg"] }
serde_json = "1.0"
libwayshot = "0.7"
wl-clipboard-rs = "0.9"
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
# SCTK 0.19 keeps calloop optional and does not re-export it, so depend on the
# matching versions directly to drive a unified Wayland + unix-socket event loop.
calloop = "0.13"
calloop-wayland-source = "0.3"
x11rb = "0.13"
arboard = { version = "3.4", default-features = false, features = ["image-data"] }
# Pure-CPU 2D rasterizer for the new region-selector overlay (behind --new).
# No GPU cold-start; unifies on the same wl_shm path the shelf already uses.
tiny-skia = "0.11"
# Anti-aliased glyph rasterization for the selector's W×H dimension badge, from a
# tiny embedded DejaVu Sans Bold subset (assets/fonts/, digits + ×).
ab_glyph = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The user runs the debug build (~/.cargo/bin/boltsnap -> target/debug). Image
# decode/resize is pure CPU and unbearably slow when compiled unoptimized (a
# Lanczos3/Triangle resize of a multi-megapixel capture took seconds), stalling
# the shelf preview. Optimize just the imaging dependencies in dev builds — our
# own crate stays unoptimized for fast incremental compiles + good backtraces.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3

[package.metadata.deb]
maintainer = "drvcvt <matti@dash.fm>"
copyright = "2026, boltsnap contributors"
license-file = ["LICENSE", "0"]
extended-description = """\
boltsnap is a fast, in-process screenshot tool for Wayland (Hyprland, Sway, KDE)
and X11 with a built-in annotation editor. It captures full screens, regions,
and windows without external CLI helpers like maim, import, xdotool, or xclip."""
section = "graphics"
priority = "optional"
assets = [
    ["target/release/boltsnap", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/boltsnap/README", "644"],
    ["LICENSE", "usr/share/doc/boltsnap/LICENSE", "644"],
]
recommends = "libgl1, libegl1, libxkbcommon0, libwayland-client0"
